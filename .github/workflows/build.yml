name: Build iOS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build SandboxAgent
    runs-on: macos-14

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Select Xcode 15.4
      run: |
        sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
        xcodebuild -version

    - name: Install XcodeGen
      run: |
        brew install xcodegen
        xcodegen --version

    - name: Generate Xcode project (legacy format)
      run: |
        xcodegen generate --spec project.yml --project-root .
        # Force project to Xcode 15.4 compatible format
        ruby -e "
          require 'xcodeproj'
          project_path = 'SandboxAgent.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          # Set compatibility version to Xcode 15
          project.root_object.attributes['LastUpgradeCheck'] = '1530'
          project.root_object.attributes['LastSwiftUpdateCheck'] = '1530'
          # Force object version to 56 (Xcode 15)
          project.root_object.object_version = 56
          project.save
          puts 'Converted to Xcode 15 compatible format'
        " || echo "Ruby xcodeproj not available, using plutil"
        # If Ruby failed, manually patch project.pbxproj object version
        if grep -q "objectVersion = 77" SandboxAgent.xcodeproj/project.pbxproj 2>/dev/null; then
          sed -i '' 's/objectVersion = 77/objectVersion = 56/g' SandboxAgent.xcodeproj/project.pbxproj
          echo "Patched objectVersion 77 -> 56"
        fi

    - name: List Xcode project
      run: |
        xcodebuild -list -project SandboxAgent.xcodeproj || echo "project listing failed"

    - name: Build for simulator
      run: |
        xcodebuild \
          -project SandboxAgent.xcodeproj \
          -scheme SandboxAgent \
          -configuration Release \
          -sdk iphonesimulator \
          -derivedDataPath build \
          -destination 'generic/platform=iOS Simulator' \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          build

    - name: Locate built .app
      run: |
        APP_PATH=$(find build -name "SandboxAgent.app" -type d | head -1)
        echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
        echo "Found: $APP_PATH"

    - name: Package as IPA
      run: |
        mkdir -p payload
        cp -R "$APP_PATH" payload/
        cd payload
        mkdir -p Payload
        mv SandboxAgent.app Payload/
        zip -r SandboxAgent.ipa Payload
        ls -la

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: SandboxAgent-IPA
        path: payload/SandboxAgent.ipa
        if-no-files-found: error
        retention-days: 30

    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          build/Logs/**/*.log
          build/Logs/**/*.txt
        retention-days: 7
